<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>blamethe.tech — descend the stack</title>
    <meta
      name="description"
      content="An outage happened. Descend the stack, interrogate every layer, and find out whose fault it was. (It was the tech.)"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- gives the document its scrollable height: one viewport per layer -->
    <div class="scroll-track"></div>

    <!-- spotlight scrim — dims the world around the speaker -->
    <div class="scrim" id="scrim"></div>

    <!-- intro: boot count, then the cold open -->
    <div id="intro" class="intro">
      <div class="intro-num" id="intro-num">0</div>
      <div class="intro-lines" id="intro-lines"></div>
      <button class="intro-go" id="intro-go" type="button" hidden>
        &#9660;&nbsp;&nbsp;begin the descent
      </button>
    </div>

    <header class="hud">
      <div class="brand">blame<span>the.tech</span></div>
      <button id="theme" class="theme-btn" type="button" aria-label="Toggle light/dark">
        <span class="theme-dot"></span>
      </button>
    </header>

    <!-- the stack map -->
    <aside class="spine" id="spine" aria-hidden="true"></aside>

    <!-- anchored dialogue panel — follows the speaker -->
    <aside class="station" id="station">
      <div class="st-head">
        <span class="st-depth" id="st-depth">01</span>
        <span class="st-role" id="st-role">The Complainant</span>
      </div>
      <div class="st-name" id="st-name">THE USER</div>
      <div class="st-script" id="st-script"></div>
    </aside>

    <!-- shown when a scene finishes -->
    <div class="descend-cue" id="descend-cue">
      <span>keep descending</span>
      <span class="arrow">&darr;</span>
    </div>

    <!-- the verdict, at the bottom -->
    <div class="verdict" id="verdict" hidden>
      <div class="verdict-card">
        <div class="v-head">
          <span class="v-case" id="v-case">BT-0000</span>
          <span class="v-sev" id="v-sev">SEV-2</span>
        </div>
        <div class="v-row"><span class="v-key">incident</span><span class="v-val" id="v-incident"></span></div>
        <div class="v-row"><span class="v-key">root cause</span><span class="v-val" id="v-root"></span></div>
        <div class="v-row"><span class="v-key">finding</span><span class="v-val" id="v-finding"></span></div>
        <div class="v-stamp">
          <span class="v-stamp-key">blame assigned to</span>
          <span class="v-stamp-val" id="v-blame">THE TECH</span>
        </div>
        <div class="v-row"><span class="v-key">recommended</span><span class="v-val" id="v-rec"></span></div>
        <div class="v-foot">
          <span id="v-confidence">confidence 99%</span>
          <button class="v-btn" id="v-again" type="button">re-run the descent</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">The Blame Engine</title>
  <desc id="desc">A cinematic blue investigation beam descends through ten layers of a dark technology stack toward a red final verdict.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#090a0d"/><stop offset="1" stop-color="#11131a"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#78a0ff" stop-opacity=".05"/><stop offset=".7" stop-color="#3b74ff" stop-opacity=".32"/><stop offset="1" stop-color="#ff414c" stop-opacity=".18"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#8eaeff"/><stop offset=".35" stop-color="#3b74ff"/><stop offset="1" stop-color="#183070"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1600" height="760" rx="34" fill="url(#bg)"/><rect width="1600" height="760" rx="34" fill="url(#grid)"/>
  <path d="M1185 72 L1450 680 H920Z" fill="url(#beam)"/>
  <g transform="translate(1050 86)" font-family="Arial, Helvetica, sans-serif">
    <path d="M130 0V596" stroke="#3b74ff" stroke-width="3" opacity=".55"/>
    <g font-size="15" font-weight="700" letter-spacing="2">
      <g transform="translate(0 0)"><circle cx="130" cy="18" r="16" fill="url(#light)" filter="url(#glow)"/><text x="165" y="23" fill="#b8c8f5">01 USER</text></g>
      <g transform="translate(0 61)"><circle cx="130" cy="18" r="14" fill="#315fd1"/><text x="165" y="23" fill="#a9b9e8">02 FRONTEND</text></g>
      <g transform="translate(0 122)"><circle cx="130" cy="18" r="13" fill="#2b55ba"/><text x="165" y="23" fill="#9dabd5">03 BACKEND</text></g>
      <g transform="translate(0 183)"><circle cx="130" cy="18" r="12" fill="#254ca7"/><text x="165" y="23" fill="#929fc7">04 DATABASE</text></g>
      <g transform="translate(0 244)"><circle cx="130" cy="18" r="11" fill="#214393"/><text x="165" y="23" fill="#8793b8">05 NETWORK</text></g>
      <g transform="translate(0 305)"><circle cx="130" cy="18" r="14" fill="#3b74ff" filter="url(#glow)"/><text x="165" y="23" fill="#c2d0ff">06 DNS</text></g>
      <g transform="translate(0 366)"><circle cx="130" cy="18" r="11" fill="#403a99"/><text x="165" y="23" fill="#9992c5">07 KERNEL</text></g>
      <g transform="translate(0 427)"><circle cx="130" cy="18" r="12" fill="#593589"/><text x="165" y="23" fill="#ad8fc2">08 HARDWARE</text></g>
      <g transform="translate(0 488)"><circle cx="130" cy="18" r="14" fill="#8b3d93"/><text x="165" y="23" fill="#d7a0d7">09 COSMIC RAY</text></g>
      <g transform="translate(0 549)"><circle cx="130" cy="18" r="19" fill="#ff414c" filter="url(#glow)"/><text x="165" y="23" fill="#ffc0c4">10 ROOT CAUSE</text></g>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="116" fill="#3b74ff" font-size="21" font-weight="700" letter-spacing="7">CASE BT-0247 · SEV-1</text>
    <text x="92" y="231" fill="#f4f4f5" font-size="92" font-weight="800" letter-spacing="-2">THE BLAME</text>
    <text x="92" y="326" fill="#f4f4f5" font-size="92" font-weight="800" letter-spacing="-2">ENGINE</text>
    <text x="98" y="394" fill="#a2a2ad" font-size="25">Production is down. Everyone has an alibi.</text>
    <g transform="translate(98 472)"><rect width="690" height="120" rx="14" fill="#101117" stroke="#303443"/><text x="28" y="40" fill="#82828c" font-size="16" font-weight="700" letter-spacing="3">INVESTIGATOR DIRECTIVE</text><text x="28" y="82" fill="#f4f4f5" font-size="27" font-weight="700">DESCEND THE STACK.</text></g>
    <text x="98" y="666" fill="#ff727a" font-size="19" font-weight="700" letter-spacing="4">VERDICT: IT ALWAYS BLAMES THE TECH.</text>
  </g>
  <rect x="2" y="2" width="1596" height="756" rx="32" fill="none" stroke="#30323b" stroke-width="4"/>
</svg>
